# This virtual host serves only the dedicated Mandarin subdomain.
server {
    listen 80;
    listen [::]:80;
    server_name mandarin.aiducation.asia;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://mandarin.aiducation.asia$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mandarin.aiducation.asia;
    ssl_certificate /etc/letsencrypt/live/mandarin.aiducation.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mandarin.aiducation.asia/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/maanshan/current/public;
    index index.html;
    server_tokens off;
    autoindex off;
    client_max_body_size 4m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
        application/wasm wasm;
        model/gltf-binary glb;
        model/gltf+json gltf;
        audio/wav wav;
        font/woff2 woff2;
        image/avif avif;
    }
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = / { return 302 /maanshan/; }
    location = /maanshan { return 308 /maanshan/; }
    location ~ /\. { return 404; }
    location ~ ^/(?:api/_lib|server|deploy|scripts|node_modules|backup|logs)(?:/|$) { return 404; }
    # Initialization is an administrative loopback-only operation.
    location ~ ^/api/maanshan-init/?$ { return 404; }
    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 35s;
        proxy_read_timeout 75s;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Cache-Control "no-store" always;
    }
    # Optional exact animation redirects are managed separately from site code.
    include /etc/nginx/maanshan-media.conf;

    location ~* \.(?:html|js|mjs|css|json|glb|gltf)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
    }
    location ~* \.(?:png|jpg|jpeg|webp|avif|svg|ico|gif|mp4|webm|mp3|wav|ogg|woff|woff2|wasm|pdf)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options nosniff always;
    }
    location / { try_files $uri/ =404; add_header Cache-Control "no-cache"; }
}
