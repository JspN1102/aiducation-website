# Showcase for the ICP-filed domain (桂ICP备2026022751号) while the school stays on
# mandarin.aiducation.asia: the same pages straight from Guangzhou, but no school
# API at all. maanshan/showcase.mjs opens every grade without an account; nginx
# refuses /api/ and /school-api/ so nothing here can sign in, read or store data.
# Media is served from this disk rather than the COS redirects, because COS CORS
# does not list this origin and fonts, models and the resource pack are fetched.
# www redirects to the bare domain; both names are on one Let's Encrypt certificate (webroot renewal).
server {
    listen 80;
    listen [::]:80;
    server_name aiducation.hk.cn www.aiducation.hk.cn;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://aiducation.hk.cn$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.aiducation.hk.cn;
    ssl_certificate /etc/letsencrypt/live/aiducation.hk.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aiducation.hk.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    return 301 https://aiducation.hk.cn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aiducation.hk.cn;
    ssl_certificate /etc/letsencrypt/live/aiducation.hk.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aiducation.hk.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/maanshan/current/public;
    index index.html;
    server_tokens off;
    autoindex off;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
        application/wasm wasm;
        model/gltf-binary glb;
        model/gltf+json gltf;
        audio/wav wav;
        font/woff2 woff2;
        image/avif avif;
    }
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = / { return 302 /school/; }
    location = /school { return 308 /school/; }
    location = /school/recovery-sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        add_header X-Content-Type-Options nosniff always;
    }
    location = /favicon.ico { return 302 /favicon.png; }
    location = /maanshan { return 308 /maanshan/; }
    location ~ /\. { return 404; }
    location ~ ^/(?:api/_lib|server|deploy|scripts|node_modules|backup|logs)(?:/|$) { return 404; }
    location ^~ /api/ { return 404; }
    location ^~ /school-api/ { return 404; }

    location ~* \.(?:html|js|mjs|css|json|glb|gltf)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
    }
    location ~* \.(?:png|jpg|jpeg|webp|avif|svg|ico|gif|mp4|webm|mp3|m4a|wav|ogg|woff|woff2|wasm|pdf)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options nosniff always;
    }
    location / { try_files $uri/ =404; add_header Cache-Control "no-cache"; }
}
