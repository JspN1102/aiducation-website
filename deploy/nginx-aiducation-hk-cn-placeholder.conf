# Until the school moves to the ICP-filed domain, aiducation.hk.cn only shows a placeholder page carrying the ICP number,
# so the domain keeps resolving to this Tencent server as the filing requires. nginx-aiducation-hk-cn.conf is the full site.
server {
    listen 80;
    listen [::]:80;
    server_name aiducation.hk.cn www.aiducation.hk.cn;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://aiducation.hk.cn$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.aiducation.hk.cn;
    ssl_certificate /etc/letsencrypt/live/aiducation.hk.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aiducation.hk.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    return 301 https://aiducation.hk.cn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aiducation.hk.cn;
    ssl_certificate /etc/letsencrypt/live/aiducation.hk.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aiducation.hk.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/aiducation-hk-cn;
    server_tokens off;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    default_type text/html;
    charset utf-8;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location / { return 302 /; }
}
