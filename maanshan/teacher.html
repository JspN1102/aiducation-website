<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教師後台 · 馬鞍山靈糧小學</title>
<style>
@font-face{font-family:'Noto Sans TC';src:url('./vendor/fonts/noto-sans-tc.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:'Noto Serif TC';src:url('./vendor/fonts/noto-serif-tc.woff2') format('woff2');font-weight:200 900;font-style:normal;font-display:swap}
:root{--paper:#f6f8f8;--ink:#202b2b;--muted:#687676;--line:#dfe7e5;--green:#176759;--green-bg:#e8f2ee;--blue:#416a98;--blue-bg:#edf2f8;--red:#b54d57;--red-bg:#faedf0;--sans:'Noto Sans TC','Microsoft JhengHei',sans-serif;--serif:'Noto Serif TC','PMingLiU',serif}
*{margin:0;padding:0;box-sizing:border-box;letter-spacing:0}
body{font:14px/1.6 var(--sans);background:var(--paper);color:var(--ink);min-height:100vh}
button,input{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:default;opacity:.5}a{color:var(--green)}svg{width:18px;height:18px;flex-shrink:0}[hidden]{display:none!important}:focus-visible{outline:3px solid #83b6a9;outline-offset:3px}
.top-nav{background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.top-nav-left{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.top-nav-logo{font:700 11px var(--sans);color:var(--green)}.top-nav-title{font:600 17px var(--serif)}.top-nav-user{font-size:12px;color:var(--muted)}.student-link{display:inline-flex;align-items:center;gap:7px;font-size:12px;text-decoration:none;white-space:nowrap}
.main{display:flex;max-width:1280px;margin:0 auto;padding:24px;gap:28px;min-height:calc(100vh - 62px)}.sidebar{width:184px;flex-shrink:0}.sidebar-section{padding:0 0 18px;margin-bottom:18px;border-bottom:1px solid var(--line)}.sidebar-label{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:8px}.filter-btn{display:block;width:100%;min-height:38px;text-align:left;padding:8px 10px;border:0;background:none;border-radius:6px;font-size:13px;color:var(--muted);margin-bottom:3px;overflow-wrap:anywhere}.filter-btn:hover{background:var(--green-bg);color:var(--green)}.filter-btn.active{background:var(--green);color:#fff;font-weight:600}
.content{flex:1;min-width:0}.content-toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap}.view-title{font:600 19px/1.5 var(--serif);overflow-wrap:anywhere}.view-subtitle{font-size:12px;color:var(--muted);margin-top:3px}.toolbar-actions{display:flex;align-items:center;gap:14px}.demo-control{display:flex;align-items:center;gap:7px;font-size:12px;white-space:nowrap;cursor:pointer}.demo-control input{width:17px;height:17px;accent-color:var(--green)}.icon-button{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);border-radius:6px;color:var(--green)}.icon-button:hover{background:var(--green-bg)}.demo-badge{display:block;margin-bottom:16px;padding:10px 14px;border-left:3px solid var(--blue);background:var(--blue-bg);color:var(--blue);font-size:13px;font-weight:600}
.stats-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.stat-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px 12px;min-height:96px}.stat-card.highlight{border-top:3px solid var(--green);padding-top:14px}.stat-value{font:700 26px/1.3 var(--sans);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.stat-label{font-size:11px;color:var(--muted);margin-top:5px}
.section{background:#fff;padding:18px 20px;margin-bottom:18px;border-top:1px solid var(--line)}.section-title{font:600 14px/1.5 var(--sans);margin-bottom:14px}.section-note{font-size:11px;color:var(--muted);margin-top:-7px;margin-bottom:14px}.chart-wrap{width:100%;height:180px;position:relative}.chart-wrap canvas{display:block;width:100%;height:100%}.phon-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}.phon-label{font-size:12px;color:var(--muted);width:130px;flex-shrink:0;overflow-wrap:anywhere}.phon-bar-bg{flex:1;height:10px;background:var(--line);border-radius:3px;overflow:hidden}.phon-bar{height:100%;border-radius:3px}.phon-pct{font-size:12px;font-variant-numeric:tabular-nums;width:48px;text-align:right;flex-shrink:0}
.error-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.error-row:last-child{border:0}.error-char{font:600 23px var(--serif);width:38px;height:38px;display:grid;place-items:center;background:var(--red-bg);border-radius:6px;flex-shrink:0;overflow-wrap:anywhere}.error-info{flex:1;min-width:0}.error-type{font-size:12px;color:var(--red);overflow-wrap:anywhere}.error-rate{font-size:12px;color:var(--muted)}.error-bar-bg{width:100px;height:6px;background:var(--line);border-radius:3px;overflow:hidden;flex-shrink:0}.error-bar{height:100%;background:var(--red)}
.table-wrap{max-width:100%;overflow:auto}.stu-table{width:100%;border-collapse:collapse;min-width:680px}.stu-table th{text-align:left;font-size:11px;font-weight:500;color:var(--muted);padding:9px 10px;border-bottom:2px solid var(--line);min-width:62px;max-width:140px;overflow-wrap:anywhere}.stu-table td{padding:10px;border-bottom:1px solid var(--line);font-size:12px;max-width:170px;overflow-wrap:anywhere}.stu-table tr:hover td{background:var(--green-bg)}.stu-name{font-weight:500}.stu-score{font-variant-numeric:tabular-nums;font-weight:600;font-size:15px}.grade-tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px}.g-ex{background:var(--green-bg);color:var(--green)}.g-good{background:var(--blue-bg);color:var(--blue)}.g-pass{background:#eef1f1;color:var(--muted)}.g-fail{background:var(--red-bg);color:var(--red)}.unmeasured{color:var(--muted)}.empty-state{padding:36px 18px;text-align:center;color:var(--muted);font-size:13px}.status-panel{min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#fff;border-top:1px solid var(--line);padding:28px;text-align:center}.status-panel p{color:var(--muted);font-size:13px}.retry-button{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:8px 14px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--green)}
@media(max-width:900px){.main{gap:20px;padding:20px}.sidebar{width:150px}.stat-value{font-size:23px}.stat-card{padding:14px 10px}}
@media(max-width:700px){.top-nav{padding:14px 16px;align-items:flex-start}.top-nav-left{gap:7px 12px}.top-nav-user{width:100%;font-size:11px}.main{display:block;padding:16px}.sidebar{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:8px}.sidebar-section{padding-bottom:12px;margin-bottom:0}.sidebar-section:last-child{grid-column:1/-1}.filter-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}.filter-btn{min-height:40px;padding:8px;font-size:12px;margin:0}.content-toolbar{margin-top:18px}.view-title{font-size:18px}.stats-row{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.section{padding:16px 12px}.phon-label{width:112px}.error-bar-bg{width:64px}.demo-badge{font-size:12px}.student-link{font-size:11px}.top-nav-logo{font-size:10px}}
</style>
<script src="./vendor/lucide.min.js" defer></script>
</head>
<body>
<nav class="top-nav" aria-label="教師導覽">
  <div class="top-nav-left"><span class="top-nav-logo">AIDUCATION</span><span class="top-nav-title">教師後台</span><span class="top-nav-user">馬鞍山靈糧小學</span></div>
  <a class="student-link" href="./"><i data-lucide="arrow-left" aria-hidden="true"></i>學生古詩練習</a>
</nav>
<main class="main">
  <aside class="sidebar" aria-label="成績篩選">
    <section class="sidebar-section"><h2 class="sidebar-label">年級</h2><div class="filter-list" id="grade-filters"></div></section>
    <section class="sidebar-section"><h2 class="sidebar-label">班別</h2><div class="filter-list" id="class-filters"></div></section>
    <section class="sidebar-section"><h2 class="sidebar-label">古詩</h2><div class="filter-list" id="poem-filter"><p class="view-subtitle">正在載入古詩</p></div></section>
  </aside>
  <section class="content">
    <div class="content-toolbar">
      <div><h1 class="view-title" id="view-title">班級練習紀錄</h1><p class="view-subtitle" id="view-subtitle">實際已同步紀錄</p></div>
      <div class="toolbar-actions">
        <label class="demo-control"><input type="checkbox" id="demo-toggle">示範數據</label>
        <button class="icon-button" id="refresh-button" type="button" title="重新載入" aria-label="重新載入" disabled><i data-lucide="refresh-cw" aria-hidden="true"></i></button>
      </div>
    </div>
    <p class="demo-badge" id="demo-badge" role="status" hidden>示範數據，非學生實際成績</p>
    <div id="content" aria-live="polite"></div>
  </section>
</main>
<script>
const CLASSES = {1:['A','B','C','D','E'],2:['A','B','C','D','E'],3:['A','B','C','D','E','F'],4:['A','B','C','D','E','F'],5:['A','B','C','D','E'],6:['A','B','C','D','E']};
let poems = [];
let curGrade = 2;
let curClass = 'A';
let selectedPoemId = 2;
let demoMode = false;
let requestGeneration = 0;
let activeRequest = null;
let activeDistribution = null;

function escapeHtml(value){
  return String(value ?? '').replace(/[&<>"']/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
}
function scoreValue(value){
  if(typeof value !== 'number' && typeof value !== 'string') return null;
  if(typeof value === 'string' && !value.trim()) return null;
  const score = Number(value);
  return Number.isFinite(score) && score >= 0 && score <= 100 ? score : null;
}
function scoreText(value){ return value === null ? '未測' : String(Math.round(value * 10) / 10); }
function scoreColor(value){ return value === null ? 'var(--muted)' : value >= 80 ? 'var(--green)' : value >= 60 ? 'var(--blue)' : 'var(--red)'; }
function selectedPoem(){ return poems.find(poem => poem.id === selectedPoemId); }
function poemPhonics(){ return [...new Set((selectedPoem()?.phonics || []).map(item => item.label))]; }
function icons(){ window.lucide?.createIcons(); }
function parsePhonics(value){
  const result = Object.create(null);
  if(typeof value === 'string'){ try{ value = JSON.parse(value); }catch{ return result; } }
  if(!value || typeof value !== 'object' || Array.isArray(value)) return result;
  for(const [key,score] of Object.entries(value)) result[key] = scoreValue(score);
  return result;
}

function renderFilters(){
  document.getElementById('grade-filters').innerHTML = Object.keys(CLASSES).map(value => {
    const grade = Number(value);
    return '<button type="button" class="filter-btn ' + (grade === curGrade ? 'active' : '') + '" aria-pressed="' + (grade === curGrade) + '" data-grade="' + grade + '">' + grade + '年級</button>';
  }).join('');
  document.getElementById('class-filters').innerHTML = CLASSES[curGrade].map(cls => '<button type="button" class="filter-btn ' + (cls === curClass ? 'active' : '') + '" aria-pressed="' + (cls === curClass) + '" data-class="' + cls + '">' + curGrade + cls + '</button>').join('');
  if(poems.length) document.getElementById('poem-filter').innerHTML = poems.map(poem => '<button type="button" class="filter-btn ' + (poem.id === selectedPoemId ? 'active' : '') + '" aria-pressed="' + (poem.id === selectedPoemId) + '" data-poem="' + poem.id + '">' + escapeHtml(poem.title) + '</button>').join('');
  document.getElementById('view-title').textContent = curGrade + curClass + '班' + (selectedPoem() ? ' · ' + selectedPoem().title : '');
}
function renderState(message, retry = false){
  activeDistribution = null;
  document.getElementById('content').innerHTML = '<div class="status-panel" role="status"><p>' + escapeHtml(message) + '</p>' + (retry ? '<button class="retry-button" id="retry-button" type="button"><i data-lucide="refresh-cw" aria-hidden="true"></i>重新載入</button>' : '') + '</div>';
  document.getElementById('retry-button')?.addEventListener('click', () => poems.length ? renderContent() : loadPoems());
  icons();
}
function normaliseStudents(data){
  if(!Array.isArray(data)) throw new Error('Invalid students response');
  return data.map(student => ({
    id: String(student.id ?? ''),
    name: String(student.name ?? '未命名學生'),
    score: scoreValue(student.score),
    writeScore: scoreValue(student.writeScore),
    phonics: parsePhonics(student.phonics)
  })).sort((a,b) => a.score === null ? (b.score === null ? 0 : 1) : b.score === null ? -1 : b.score - a.score);
}
function createDashboard(data){
  const students = normaliseStudents(data.students);
  const scores = students.filter(student => student.score !== null).map(student => student.score);
  const distribution = [
    {range:'0–59',count:scores.filter(score => score < 60).length},
    {range:'60–69',count:scores.filter(score => score >= 60 && score < 70).length},
    {range:'70–79',count:scores.filter(score => score >= 70 && score < 80).length},
    {range:'80–89',count:scores.filter(score => score >= 80 && score < 90).length},
    {range:'90–100',count:scores.filter(score => score >= 90).length}
  ];
  const errorChars = (Array.isArray(data.errorChars) ? data.errorChars : []).map(error => ({
    c: String(error.c ?? ''), type: String(error.type || '書寫錯誤'),
    count: typeof error.count === 'number' && Number.isFinite(error.count) && error.count >= 0 ? Math.round(error.count) : null
  })).filter(error => error.c).slice(0,5);
  return {
    students, total: students.length, tested: scores.length,
    avg: scores.length ? scores.reduce((sum, score) => sum + score, 0) / scores.length : null,
    passRate: scores.length ? Math.round(scores.filter(score => score >= 60).length / scores.length * 100) : null,
    excellentRate: scores.length ? Math.round(scores.filter(score => score >= 90).length / scores.length * 100) : null,
    distribution, phonAvg: parsePhonics(data.phonAvg), errorChars
  };
}

function mockClassData(){
  let seed = curGrade * 1000 + curClass.charCodeAt(0) * 13 + selectedPoemId * 71;
  const random = () => { seed = (Math.imul(seed,1664525) + 1013904223) >>> 0; return seed / 4294967296; };
  const labels = poemPhonics();
  const students = Array.from({length:24}, (_,index) => {
    const measured = index < 20;
    return {
      id: 'demo-' + index, name: '示範學生 ' + String(index + 1).padStart(2,'0'),
      score: measured ? Math.round(42 + random() * 57) : null,
      writeScore: index < 22 ? Math.round(45 + random() * 55) : null,
      phonics: measured ? Object.fromEntries(labels.map(label => [label, Math.round(40 + random() * 60)])) : {}
    };
  });
  const phonAvg = Object.fromEntries(labels.map(label => {
    const values = students.filter(student => student.score !== null).map(student => student.phonics[label]);
    return [label, Math.round(values.reduce((sum,value) => sum + value,0) / values.length)];
  }));
  const errorChars = (selectedPoem()?.dictation || []).slice(0,5).map((item,index) => ({c:item.char,type:'書寫錯誤（示範）',count:9-index}));
  return { students, phonAvg, errorChars };
}

async function renderContent(){
  const generation = ++requestGeneration;
  activeRequest?.abort();
  activeRequest = null;
  document.getElementById('demo-badge').hidden = !demoMode;
  document.getElementById('view-subtitle').textContent = demoMode ? '示範班級紀錄' : '實際已同步紀錄';
  if(!selectedPoem()) return;
  if(demoMode){ renderDashboard(createDashboard(mockClassData())); return; }
  const controller = new AbortController();
  activeRequest = controller;
  const selection = {grade:curGrade,cls:curClass,poemId:selectedPoemId};
  renderState('正在載入練習紀錄');
  try{
    const response = await fetch('/api/maanshan-data?' + new URLSearchParams(selection), {signal:controller.signal,cache:'no-store'});
    if(!response.ok) throw new Error('Data request failed');
    const data = await response.json();
    if(generation !== requestGeneration) return;
    if(data.error) throw new Error('Data source unavailable');
    if(!data.hasData){ renderState('這個班別和古詩暫未有已同步的練習紀錄。'); return; }
    const dashboard = createDashboard(data);
    if(!dashboard.total){ renderState('這個班別和古詩暫未有已同步的練習紀錄。'); return; }
    renderDashboard(dashboard);
  }catch(error){
    if(generation !== requestGeneration || error.name === 'AbortError') return;
    renderState('暫時未能取得練習紀錄，請稍後重試。',true);
  }finally{
    if(generation === requestGeneration) activeRequest = null;
  }
}

function renderDashboard(data){
  const labels = [...new Set([...poemPhonics(),...Object.keys(data.phonAvg),...data.students.flatMap(student => Object.keys(student.phonics))])];
  const phonRows = labels.map(label => {
    const value = data.phonAvg[label] ?? null;
    return '<div class="phon-row"><span class="phon-label">' + escapeHtml(label) + '</span><div class="phon-bar-bg"><div class="phon-bar" style="width:' + (value ?? 0) + '%;background:' + scoreColor(value) + '"></div></div><span class="phon-pct">' + scoreText(value) + (value === null ? '' : ' 分') + '</span></div>';
  }).join('');
  const highestErrors = Math.max(...data.errorChars.map(error => error.count || 0),1);
  const errorRows = data.errorChars.map(error => '<div class="error-row"><div class="error-char">' + escapeHtml(error.c) + '</div><div class="error-info"><p class="error-type">' + escapeHtml(error.type) + '</p><p class="error-rate">' + (error.count === null ? '未提供次數' : error.count + ' 次錯誤紀錄') + '</p></div><div class="error-bar-bg"><div class="error-bar" style="width:' + (error.count === null ? 0 : error.count / highestErrors * 100) + '%"></div></div></div>').join('');
  let rank = 0;
  const rows = data.students.map(student => {
    const measured = student.score !== null;
    const grade = !measured ? '未測' : student.score >= 90 ? '優' : student.score >= 75 ? '良' : student.score >= 60 ? '中' : '待加強';
    const gradeClass = !measured ? 'g-pass' : student.score >= 90 ? 'g-ex' : student.score >= 75 ? 'g-good' : student.score >= 60 ? 'g-pass' : 'g-fail';
    return '<tr><td>' + (measured ? ++rank : '未測') + '</td><td class="stu-name">' + escapeHtml(student.name) + '</td><td class="stu-score" style="color:' + scoreColor(student.score) + '">' + scoreText(student.score) + '</td><td class="stu-score" style="color:' + scoreColor(student.writeScore) + '">' + scoreText(student.writeScore) + '</td><td><span class="grade-tag ' + gradeClass + '">' + grade + '</span></td>' + labels.map(label => {
      const value = student.phonics[label] ?? null;
      return '<td style="color:' + scoreColor(value) + '">' + scoreText(value) + '</td>';
    }).join('') + '</tr>';
  }).join('');
  document.getElementById('content').innerHTML =
    '<div class="stats-row">' +
    '<div class="stat-card highlight"><p class="stat-value">' + scoreText(data.avg) + '</p><p class="stat-label">朗讀平均分</p></div>' +
    '<div class="stat-card"><p class="stat-value">' + (data.passRate === null ? '未測' : data.passRate + '%') + '</p><p class="stat-label">朗讀合格率（≥60）</p></div>' +
    '<div class="stat-card"><p class="stat-value">' + (data.excellentRate === null ? '未測' : data.excellentRate + '%') + '</p><p class="stat-label">朗讀優秀率（≥90）</p></div>' +
    '<div class="stat-card"><p class="stat-value">' + data.tested + ' / ' + data.total + '</p><p class="stat-label">已測 / 有紀錄學生</p></div></div>' +
    '<section class="section"><h2 class="section-title">朗讀成績分佈</h2>' + (data.tested ? '<div class="chart-wrap"><canvas id="dist-chart" role="img" aria-label="' + escapeHtml(data.distribution.map(bin => bin.range + '分：' + bin.count + '人').join('；')) + '"></canvas></div>' : '<p class="empty-state">尚未有朗讀成績</p>') + '</section>' +
    '<section class="section"><h2 class="section-title">語音知識平均得分</h2>' + (phonRows || '<p class="empty-state">尚未有語音知識成績</p>') + '</section>' +
    '<section class="section"><h2 class="section-title">默寫錯字紀錄（前5項）</h2><p class="section-note">按已提交的默寫錯誤紀錄次數統計</p>' + (errorRows || '<p class="empty-state">目前沒有默寫錯字紀錄</p>') + '</section>' +
    '<section class="section"><h2 class="section-title">學生成績</h2><div class="table-wrap" role="region" aria-label="學生成績表" tabindex="0"><table class="stu-table"><thead><tr><th scope="col">朗讀排名</th><th scope="col">姓名</th><th scope="col">朗讀分數</th><th scope="col">默寫分數</th><th scope="col">朗讀等級</th>' + labels.map(label => '<th scope="col">' + escapeHtml(label) + '</th>').join('') + '</tr></thead><tbody>' + rows + '</tbody></table></div></section>';
  activeDistribution = data.tested ? data.distribution : null;
  drawDistChart();
}
function drawDistChart(){
  const canvas = document.getElementById('dist-chart');
  if(!canvas || !activeDistribution) return;
  const ratio = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  if(!rect.width || !rect.height) return;
  canvas.width = Math.round(rect.width * ratio);
  canvas.height = Math.round(rect.height * ratio);
  const context = canvas.getContext('2d');
  context.scale(ratio,ratio);
  const maximum = Math.max(...activeDistribution.map(item => item.count),1);
  const gap = rect.width / activeDistribution.length;
  const width = gap * .58;
  const colors = ['#b54d57','#7b9aa7','#416a98','#4a8b77','#176759'];
  activeDistribution.forEach((item,index) => {
    const height = item.count / maximum * (rect.height - 54);
    const left = index * gap + (gap - width) / 2;
    const top = rect.height - 30 - height;
    context.fillStyle = colors[index];
    context.fillRect(left,top,width,height);
    context.fillStyle = '#202b2b';
    context.font = '600 12px "Noto Sans TC", sans-serif';
    context.textAlign = 'center';
    context.fillText(String(item.count),left + width / 2,top - 8);
    context.fillStyle = '#687676';
    context.font = '11px "Noto Sans TC", sans-serif';
    context.fillText(item.range,left + width / 2,rect.height - 10);
  });
}

async function loadPoems(){
  renderState('正在載入古詩資料');
  try{
    const response = await fetch('./poems.json');
    if(!response.ok) throw new Error('Poem data unavailable');
    const data = await response.json();
    if(!Array.isArray(data.poems) || !data.poems.length) throw new Error('Invalid poem data');
    poems = data.poems.filter(poem => Number.isInteger(poem.id) && typeof poem.title === 'string');
    if(!poems.length) throw new Error('No selectable poems');
    if(!selectedPoem()) selectedPoemId = poems[0].id;
    document.getElementById('refresh-button').disabled = false;
    renderFilters();
    renderContent();
  }catch{
    renderState('暫時未能載入古詩資料，請重新載入。',true);
  }
}
document.getElementById('grade-filters').addEventListener('click',event => {
  const button = event.target.closest('[data-grade]');
  if(!button) return;
  curGrade = Number(button.dataset.grade);
  curClass = CLASSES[curGrade][0];
  renderFilters(); renderContent();
});
document.getElementById('class-filters').addEventListener('click',event => {
  const button = event.target.closest('[data-class]');
  if(!button) return;
  curClass = button.dataset.class;
  renderFilters(); renderContent();
});
document.getElementById('poem-filter').addEventListener('click',event => {
  const button = event.target.closest('[data-poem]');
  if(!button) return;
  selectedPoemId = Number(button.dataset.poem);
  renderFilters(); renderContent();
});
document.getElementById('demo-toggle').addEventListener('change',event => { demoMode = event.target.checked; renderContent(); });
document.getElementById('refresh-button').addEventListener('click',renderContent);
window.addEventListener('resize',drawDistChart);
window.addEventListener('DOMContentLoaded',icons);
renderFilters();
loadPoems();
</script>
</body>
