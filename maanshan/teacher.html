<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教師後台 · 馬鞍山靈糧小學</title>
<link rel="preconnect" href="https://fonts.loli.net">
<link href="https://fonts.loli.net/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f5f0e8;--ink:#1a1612;--ink-80:#3d3630;--ink-60:#6b6259;--ink-40:#9e9488;--ink-20:#c9c1b5;--ink-10:#e2ddd5;--green:#2a5a4a;--green-light:#3d7a66;--green-bg:rgba(42,90,74,0.08);--red:#c0392b;--red-bg:rgba(192,57,43,0.06);--gold:#b8923f;--gold-bg:rgba(184,146,63,0.08);--radius:12px;--radius-sm:8px;--shadow-sm:0 1px 4px rgba(26,22,18,0.06);--shadow-md:0 4px 20px rgba(26,22,18,0.08);--font-serif:'Noto Serif TC',serif;--font-sans:'Noto Sans TC',sans-serif;--font-num:'Inter',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-sans);background:var(--paper);color:var(--ink);min-height:100vh}
.top-nav{background:#fff;border-bottom:1px solid var(--ink-10);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.top-nav-left{display:flex;align-items:center;gap:12px}
.top-nav-logo{font-family:var(--font-num);font-weight:600;font-size:10px;letter-spacing:2px;color:var(--green);border:1px solid rgba(42,90,74,0.3);padding:2px 8px;border-radius:4px}
.top-nav-title{font-family:var(--font-serif);font-weight:600;font-size:16px;color:var(--ink-80);letter-spacing:2px}
.top-nav-user{font-size:13px;color:var(--ink-40)}
.main{display:flex;max-width:1200px;margin:0 auto;padding:20px;gap:20px;min-height:calc(100vh - 52px)}
.sidebar{width:200px;flex-shrink:0}
.sidebar-section{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm);margin-bottom:16px}
.sidebar-label{font-size:11px;font-weight:500;color:var(--ink-40);letter-spacing:1px;margin-bottom:10px;text-transform:uppercase}
.filter-btn{display:block;width:100%;text-align:left;padding:8px 12px;border:none;background:none;border-radius:var(--radius-sm);font-family:var(--font-sans);font-size:13px;color:var(--ink-60);cursor:pointer;transition:all .15s;margin-bottom:2px}
.filter-btn:hover{background:var(--ink-10);color:var(--ink)}
.filter-btn.active{background:var(--green);color:#fff;font-weight:500}
.content{flex:1;min-width:0}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:#fff;border-radius:var(--radius);padding:18px 16px;box-shadow:var(--shadow-sm);text-align:center}
.stat-card.highlight{border-left:3px solid var(--green)}
.stat-value{font-family:var(--font-num);font-weight:700;font-size:28px;color:var(--ink);line-height:1.2}
.stat-label{font-size:11px;color:var(--ink-40);margin-top:4px;letter-spacing:1px}
.card{background:#fff;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);margin-bottom:20px}
.card-title{font-family:var(--font-serif);font-weight:600;font-size:14px;color:var(--ink-80);letter-spacing:2px;margin-bottom:14px}
.chart-wrap{width:100%;height:180px;position:relative}
.chart-wrap canvas{width:100%;height:100%}
/* Phonetic knowledge bars */
.phon-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.phon-label{font-size:12px;color:var(--ink-60);width:100px;text-align:right;flex-shrink:0;font-family:var(--font-num)}
.phon-bar-bg{flex:1;height:20px;background:var(--ink-10);border-radius:10px;overflow:hidden;position:relative}
.phon-bar{height:100%;border-radius:10px;transition:width .6s ease}
.phon-pct{font-family:var(--font-num);font-size:11px;font-weight:600;color:var(--ink-60);width:40px;text-align:right;flex-shrink:0}
/* Error chars */
.error-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--ink-10)}
.error-row:last-child{border-bottom:none}
.error-char{font-family:var(--font-serif);font-size:22px;font-weight:700;color:var(--ink);width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--red-bg);border-radius:var(--radius-sm)}
.error-type{font-size:12px;color:var(--red);font-weight:500}
.error-rate{font-size:12px;color:var(--ink-40)}
.error-info{flex:1}
.error-bar-bg{width:100px;height:6px;background:var(--ink-10);border-radius:3px;overflow:hidden;flex-shrink:0}
.error-bar{height:100%;background:var(--red);border-radius:3px}
/* Student table */
.stu-table{width:100%;border-collapse:collapse}
.stu-table th{text-align:left;font-size:11px;font-weight:500;color:var(--ink-40);letter-spacing:1px;padding:8px 10px;border-bottom:2px solid var(--ink-10);cursor:pointer;user-select:none}
.stu-table th:hover{color:var(--ink)}
.stu-table td{padding:10px;border-bottom:1px solid var(--ink-10);font-size:13px;color:var(--ink-80)}
.stu-table tr:hover td{background:var(--green-bg)}
.stu-name{font-weight:500}
.stu-score{font-family:var(--font-num);font-weight:700;font-size:16px}
.grade-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}
.grade-tag.g-ex{background:var(--green-bg);color:var(--green)}
.grade-tag.g-good{background:var(--gold-bg);color:var(--gold)}
.grade-tag.g-pass{background:var(--ink-10);color:var(--ink-60)}
.grade-tag.g-fail{background:var(--red-bg);color:var(--red)}
.empty-state{text-align:center;padding:40px 20px;color:var(--ink-40);font-size:14px}
/* Responsive */
@media(max-width:768px){.main{flex-direction:column;padding:12px}.sidebar{width:100%;display:flex;gap:12px;flex-wrap:wrap}.sidebar-section{flex:1;min-width:140px;margin-bottom:8px}.stats-row{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<nav class="top-nav">
  <div class="top-nav-left">
    <span class="top-nav-logo">AIDUCATION</span>
    <span class="top-nav-title">教師後台</span>
  </div>
  <span class="top-nav-user" id="nav-user">馬鞍山靈糧小學</span>
</nav>
<div class="main">
  <aside class="sidebar">
    <div class="sidebar-section">
      <p class="sidebar-label">年級</p>
      <div id="grade-filters"></div>
    </div>
    <div class="sidebar-section">
      <p class="sidebar-label">班別</p>
      <div id="class-filters"></div>
    </div>
    <div class="sidebar-section">
      <p class="sidebar-label">古詩</p>
      <div id="poem-filter">
        <button class="filter-btn active" disabled>贈汪倫</button>
      </div>
    </div>
  </aside>
  <section class="content" id="content"></section>
</div>
<script>
// School structure from roster
const CLASSES = {
  1:['A','B','C','D','E'], 2:['A','B','C','D','E'], 3:['A','B','C','D','E','F'],
  4:['A','B','C','D','E','F'], 5:['A','B','C','D','E'], 6:['A','B','C','D','E']
};
const GRADE_POEMS = {
  1:'詠鵝',2:'贈汪倫',3:'題西林壁',4:'泊船瓜洲',5:'歸園田居(其三)',6:'初春小雨'
};
// Grade 2 phonetic knowledge (第一學段)
const GRADE_PHONICS = {
  1:['四聲','a/o/e','i/u/ü','b/p/m/f','d/t/n/l'],
  2:['ia/ie','iao/iu','ian/in','iang/ing/iong','ua/uo','uai/ui'],
  3:['四聲複習','a/o/e','i/u/ü','b/p/m/f/d/t/n/l','g/k/h'],
  4:['z/c/s','zh/ch/sh/r','zi/ci/si','u/ua/uo','uai/ui'],
  5:['一四聲/二三聲','b/p','d/t','n/l','k/f/k/h'],
  6:['j/z/zh','q/c/ch','x/s/sh','an/ang']
};

let curGrade = 2, curClass = 'A';

// Generate mock data for any class
function mockClassData(grade, cls){
  const surnames = ['陳','林','王','張','李','黃','劉','吳','蔡','楊','鄭','謝','郭','許','蘇','葉','曾','徐','馬','羅','賴','何','洪','邱','廖'];
  const names2 = ['思琪','浩然','子萱','銘軒','欣怡','俊傑','雨桐','嘉欣','家豪','雅婷','宇軒','心怡','柏翰','品妤','承恩','詩涵','睿宸','芷晴','宥辰','語彤','梓涵','彥廷','紫萱','晨曦','若熙'];
  const n = grade <= 3 ? (24 + Math.floor(Math.random()*3)) : (25 + Math.floor(Math.random()*7));
  const students = [];
  const seed = grade * 100 + cls.charCodeAt(0);
  function rng(i){return((seed*131+i*997)%1000)/1000}
  for(let i=0;i<n;i++){
    const base = 55 + rng(i)*40 + (grade<=3?5:0);
    const score = Math.round(Math.min(100, Math.max(30, base + (rng(i+100)-0.5)*20)));
    const grade_ = score>=90?'優':score>=75?'良':score>=60?'中':'差';
    const si = (seed+i)%surnames.length, ni = (seed+i*3)%names2.length;
    const phonScores = {};
    GRADE_PHONICS[grade].forEach((p,j)=>{
      phonScores[p] = Math.round(Math.min(100, Math.max(20, score + (rng(i*10+j)-0.5)*30)));
    });
    students.push({name:surnames[si]+names2[ni], score, grade:grade_, phonics:phonScores, id:`${grade}${cls}-${i+1}`});
  }
  students.sort((a,b)=>b.score-a.score);
  const scores = students.map(s=>s.score);
  const avg = (scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1);
  const pass = scores.filter(s=>s>=60).length;
  const excellent = scores.filter(s=>s>=90).length;
  const dist = [
    {range:'0-59', count:scores.filter(s=>s<60).length},
    {range:'60-69', count:scores.filter(s=>s>=60&&s<70).length},
    {range:'70-79', count:scores.filter(s=>s>=70&&s<80).length},
    {range:'80-89', count:scores.filter(s=>s>=80&&s<90).length},
    {range:'90-100',count:scores.filter(s=>s>=90).length}
  ];
  // Aggregate phonics
  const phonAvg = {};
  GRADE_PHONICS[grade].forEach(p=>{
    const vals = students.map(s=>s.phonics[p]);
    phonAvg[p] = Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
  });
  // Error chars (mock top 5)
  const errChars = [
    {c:'將',type:'聲調偏誤',rate:62},{c:'聲',type:'韻母偏誤',rate:48},
    {c:'踏',type:'聲母偏誤',rate:41},{c:'倫',type:'聲調偏誤',rate:35},{c:'潭',type:'韻母偏誤',rate:28}
  ];
  const tested = Math.round(n * (0.6 + rng(999)*0.35));
  return {grade, cls, className:`${grade}${cls}班`, total:n, tested, avg:+avg, passRate:Math.round(pass/n*100), excellentRate:Math.round(excellent/n*100), distribution:dist, phonAvg, errorChars:errChars, students};
}

// Render sidebar filters
function renderFilters(){
  const gf = document.getElementById('grade-filters');
  gf.innerHTML = [1,2,3,4,5,6].map(g=>
    `<button class="filter-btn ${g===curGrade?'active':''}" onclick="selectGrade(${g})">${g}年級</button>`
  ).join('');
  const cf = document.getElementById('class-filters');
  cf.innerHTML = CLASSES[curGrade].map(c=>
    `<button class="filter-btn ${c===curClass?'active':''}" onclick="selectClass('${c}')">${curGrade}${c}</button>`
  ).join('');
  document.querySelector('#poem-filter .filter-btn').textContent = GRADE_POEMS[curGrade];
}

function selectGrade(g){
  curGrade = g;
  curClass = CLASSES[g][0];
  renderFilters();
  renderContent();
}
function selectClass(c){
  curClass = c;
  renderFilters();
  renderContent();
}

function renderContent(){
  renderDashboard(mockClassData(curGrade, curClass));
  // Try real API, fall back to mock on failure or empty
  fetch(`/api/maanshan-data?grade=${curGrade}&cls=${curClass}&poemId=${curGrade}`)
    .then(r=>r.ok?r.json():null).then(data=>{
      if(data && data.hasData && data.stats.tested > 0){
        // Map API response to dashboard format
        const s = data.stats;
        const students = data.students.map((st,i)=>{
          const score = st.score ?? 0;
          const grade_ = score>=90?'優':score>=75?'良':score>=60?'中':'差';
          return {name:st.name, score, grade:grade_, phonics:st.phonics, id:st.id};
        }).sort((a,b)=>b.score-a.score);
        renderDashboard({
          grade:curGrade, cls:curClass, className:`${curGrade}${curClass}班`,
          total:s.total, tested:s.tested, avg:s.avg,
          passRate:s.passRate, excellentRate:s.excellentRate,
          distribution:s.distribution, phonAvg:data.phonAvg,
          errorChars:data.errorChars, students
        });
      }
    }).catch(()=>{});
}

function renderDashboard(d){
  const el = document.getElementById('content');
  el.innerHTML = `
    <div class="stats-row">
      <div class="stat-card highlight"><p class="stat-value">${d.avg}</p><p class="stat-label">班均分</p></div>
      <div class="stat-card"><p class="stat-value">${d.passRate}%</p><p class="stat-label">合格率 (≥60)</p></div>
      <div class="stat-card"><p class="stat-value">${d.excellentRate}%</p><p class="stat-label">優秀率 (≥90)</p></div>
      <div class="stat-card"><p class="stat-value">${d.tested}/${d.total}</p><p class="stat-label">已測人數</p></div>
    </div>
    <div class="card">
      <p class="card-title">成績分佈</p>
      <div class="chart-wrap"><canvas id="dist-chart"></canvas></div>
    </div>
    <div class="card">
      <p class="card-title">語音知識掌握率（${curGrade}年級第一學段）</p>
      ${Object.entries(d.phonAvg).map(([k,v])=>{
        const c = v>=80?'var(--green)':v>=60?'var(--gold)':'var(--red)';
        return `<div class="phon-row">
          <span class="phon-label">${k}</span>
          <div class="phon-bar-bg"><div class="phon-bar" style="width:${v}%;background:${c}"></div></div>
          <span class="phon-pct">${v}%</span>
        </div>`;
      }).join('')}
    </div>
    <div class="card">
      <p class="card-title">高頻錯字 Top 5</p>
      ${d.errorChars.map(ec=>`<div class="error-row">
        <div class="error-char">${ec.c}</div>
        <div class="error-info"><span class="error-type">${ec.type}</span> <span class="error-rate">${ec.rate}% 學生出錯</span></div>
        <div class="error-bar-bg"><div class="error-bar" style="width:${ec.rate}%"></div></div>
      </div>`).join('')}
    </div>
    <div class="card">
      <p class="card-title">學生成績（${d.className}）</p>
      <table class="stu-table">
        <thead><tr><th>排名</th><th>姓名</th><th>分數</th><th>等級</th>${GRADE_PHONICS[curGrade].map(p=>`<th>${p}</th>`).join('')}</tr></thead>
        <tbody>${d.students.map((s,i)=>{
          const gc = s.grade==='優'?'g-ex':s.grade==='良'?'g-good':s.grade==='中'?'g-pass':'g-fail';
          return `<tr>
            <td>${i+1}</td>
            <td class="stu-name">${s.name}</td>
            <td class="stu-score" style="color:${s.grade==='優'?'var(--green)':s.grade==='差'?'var(--red)':'var(--ink)'}">${s.score}</td>
            <td><span class="grade-tag ${gc}">${s.grade}</span></td>
            ${GRADE_PHONICS[curGrade].map(p=>`<td style="font-family:var(--font-num);font-size:12px;color:${s.phonics[p]>=80?'var(--green)':s.phonics[p]>=60?'var(--gold)':'var(--red)'}">${s.phonics[p]}</td>`).join('')}
          </tr>`;
        }).join('')}</tbody>
      </table>
    </div>`;
  setTimeout(()=>drawDistChart(d.distribution), 50);
}

function drawDistChart(dist){
  const canvas = document.getElementById('dist-chart');
  if(!canvas) return;
  const dpr = window.devicePixelRatio||1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width*dpr;
  canvas.height = rect.height*dpr;
  const c = canvas.getContext('2d');
  c.scale(dpr, dpr);
  const W = rect.width, H = rect.height;
  const pad = {top:20, bottom:30, left:10, right:10};
  const maxVal = Math.max(...dist.map(d=>d.count), 1);
  const barW = (W-pad.left-pad.right)/dist.length * 0.6;
  const gap = (W-pad.left-pad.right)/dist.length;
  const colors = ['#c9c1b5','#b8923f','#2a5a4a','#2a5a4a','#2a5a4a'];

  dist.forEach((d, i)=>{
    const x = pad.left + i*gap + (gap-barW)/2;
    const barH = (d.count/maxVal) * (H-pad.top-pad.bottom);
    const y = H - pad.bottom - barH;
    // Bar
    c.fillStyle = colors[i];
    c.beginPath();
    c.roundRect(x, y, barW, barH, [4,4,0,0]);
    c.fill();
    // Value on top
    c.fillStyle = '#1a1612';
    c.font = '600 13px Inter, sans-serif';
    c.textAlign = 'center';
    c.fillText(d.count, x+barW/2, y-6);
    // Label below
    c.fillStyle = '#9e9488';
    c.font = '11px "Noto Sans TC", sans-serif';
    c.fillText(d.range, x+barW/2, H-pad.bottom+16);
  });
}

renderFilters();
renderContent();
</script>
</body>
</html>
