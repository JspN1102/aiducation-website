。","沈伯又开讲了？您且坐稳，他这一段《三国》，能说三个时辰。","茶要慢慢喝，日子要慢慢过。急什么？水还没开呢。","您瞧这汤色，清亮得很。跟做人一个道理——心里干净，面上才透亮。"]},{id:"teaguest",name:"沈鹤年",title:"告老塾师",personality:"慈和健谈",sprite:"./npc-teaguest.png",portrait:"./portrait-teaguest.png",height:68,speed:1.6,bobAmp:1,foot:{dx:.006,dy:.089},schedule:{chen:[z(31,13),z(30,12)],si:[z(11,19),z(11,20),z(12,20)],wu:[z(11,19),z(11,20)],wei:[z(11,19),z(11,20)],shen:[z(11,19),z(12,21)],you:[z(16,15),z(17,18),z(31,13)],xu:[z(31,13)]},defaultSpots:[z(11,19)],lines:["哦？面生得很哪——是外乡来的吧？坐坐坐，听老朽说段古。","咱这文化村呐，建村三百年喽。村口那对石狮子，还是前朝的旧物。","想当年老朽在县里教书，一教就是四十年。如今嘛……教不动了，就教人听故事喽。","年轻人，记着：村里的井水甜，是因为河床底下有泉眼。做人的根底啊，也是一个理。","黄鹂唱的是春天的调子。你静下心来听，字句都在里头。","看诗如看画：近的柳，远的山，一层一层都有去处。","咳咳，说到哪儿了？……罢了罢了，吃茶吃茶。"]},{id:"vendor",name:"钱通宝",title:"杂货商贩",personality:"精明爽利",sprite:"./npc-vendor.png",portrait:"./portrait-vendor.png",height:68,speed:1.8,bobAmp:1,foot:{dx:.039,dy:.122},anchored:!0,schedule:{chen:[z(18,21),z(18,21)],si:[z(18,21)],wu:[z(18,21)],wei:[z(18,21)],shen:[z(18,21)],you:[z(22,24),z(31,19)],xu:[z(31,19)]},defaultSpots:[z(18,21)],lines:["客官瞧瞧？针头线脑、油盐酱醋，老钱这儿应有尽有！","这把伞您拿着——哟，嫌贵？得，看在您面善，让两个铜板！","不瞒您说，全村谁家缺什么，我这心里啊，都有一本账。","做小买卖的，赚的就是个回头客。您下回来，我给您留着好东西！"]},{id:"farmer",name:"赵大川",title:"农夫",personality:"敦实寡言",sprite:"./npc-farmer.png",portrait:"./portrait-farmer.png",height:68,speed:1.8,bobAmp:1,foot:{dx:.004,dy:.135},schedule:{chen:[z(29,27),z(31,30),z(34,28),z(36,32)],si:[z(29,27),z(31,30),z(34,28),z(36,32)],wu:[z(31,8),z(31,9)],wei:[z(29,27),z(31,30),z(34,28),z(36,32)],shen:[z(29,27),z(31,30),z(34,28),z(36,32)],you:[z(17,16),z(18,19),z(22,18)],xu:[z(31,8)]},defaultSpots:[z(31,30)],lines:["嘿嘿，客从哪儿来？田里泥重，您站埂上说话就成。","您瞧这秧苗，一天一个样。庄稼这东西，你糊弄它，它就糊弄你。","今年雨水好，秋里准是个好收成。到时候给您留两斗新米！","俺没啥大本事，就会侍弄这几亩地。地养人呐，实在。"]},{id:"embroiderer",name:"柳青娘",title:"绣娘",personality:"温婉内秀",sprite:"./npc-embroiderer.png",portrait:"./portrait-embroiderer.png",height:68,speed:1.7,bobAmp:1,foot:{dx:-.023,dy:.122},schedule:{chen:[z(31,11)],si:[z(15,12),z(15,13),z(31,11)],wu:[z(31,11)],wei:[z(15,12),z(31,11)],shen:[z(31,11)],you:[z(31,11)],xu:[z(31,11)]},defaultSpots:[z(31,11)],lines:["呀，有客到……你、你请坐。我手上绣紧并蒂莲，争两瓣就搞掂喇。","呢个花样系照住塘入面嘅真莲描嘅。绣嘢嘛，心里要有活物，针脚先至会活。","钱老板嗰度新到咗湖州嘅丝线，听日要去拣几绺……吓，唔好意思，一讲起呢啲就停唔落嚟。","黄鹂嘅黄、柳芽嘅翠、白鹭嘅白、晴天嘅青——呢啲颜色衬埋一齐，就系春天喇。","你唔嫌弃嘅话，第日绣个香囊送你。带住上路，都算系我哋文化村嘅少少心意。"]},{id:"child",name:"小石头",title:"孩童",personality:"皮猴一个",sprite:"./npc-child.png",portrait:"./portrait-child.png",height:50,speed:2.9,bobAmp:2,foot:{dx:0,dy:.216},schedule:{chen:[z(31,12)],si:[z(15,16),z(17,15),z(16,19),z(18,14)],wu:[z(31,12)],wei:[z(22,12),z(22,20),z(28,8),z(33,16),z(16,16)],shen:[z(22,12),z(22,26),z(29,12),z(16,18)],you:[z(22,18),z(31,12)],xu:[z(31,12)]},defaultSpots:[z(16,16)],lines:["嘿！你是外乡人吧？我一眼就看出来啦！全村的人我都认识！","告诉你个秘密——桥底下有只好大好大的乌龟！不过我娘说不能去，去了要打屁股。","王掌柜家的肉最香！我每次路过都使劲闻，闻饱了就回家吃饭，嘿嘿。","你听到鸟叫了吗？……嘿嘿，我可什么都没说！","你会玩蹴鞠吗？不会？哎呀你真笨！……别告诉我娘我说你笨啊！"]},{id:"scholar",name:"顾清晏",title:"书生",personality:"清高浪漫",sprite:"./npc-scholar.png",portrait:"./portrait-scholar.png",height:68,speed:1.7,bobAmp:1,foot:{dx:-.047,dy:.081},schedule:{chen:[z(3,8),z(2,12),z(4,6)],si:[z(22,37),z(21,37)],wu:[z(22,37),z(19,34)],wei:[z(11,22),z(11,24)],shen:[z(11,22),z(11,24)],you:[z(19,34),z(26,34),z(22,37)],xu:[z(31,13)]},defaultSpots:[z(22,37)],lines:["『桃之夭夭，灼灼其华。』……啊，失礼了。见这满坡桃花，一时忘形。","兄台你看，这清河如带，落日熔金——生在江南，何必长安？","我屡试不第，家里人都替我愁。可我瞧着，这村里一茶一饭，皆是文章。","他日若得闲，愿与兄台桥上对酌，不谈功名，只看水。"]},{id:"woman",name:"张大嫂",title:"市井妇人",personality:"热心肠大嗓门",sprite:"./npc-woman.png",portrait:"./portrait-woman.png",height:68,speed:1.8,bobAmp:1,foot:{dx:.029,dy:.117},schedule:{chen:[z(15,21),z(15,22),z(16,21)],si:[z(15,21),z(16,16),z(17,19)],wu:[z(31,7)],wei:[z(31,7),z(31,8)],shen:[z(15,17),z(16,16),z(18,17)],you:[z(31,7)],xu:[z(31,7)]},defaultSpots:[z(31,7)],lines:["哟，新面孔！打哪儿来呀？吃了没？没吃上家里吃去，别客气！","跟您说，买青菜要赶早，辰时的菜叶子上还带露水呢——您瞧这捆，多水灵！","村里芝麻大的事儿都瞒不过我。昨儿顾秀才又在桥上念诗，你说说，书都念到桥上去了，哈哈！","出门在外不容易。有啥难处言语一声，文化村没有外人！"]},{id:"watchman",name:"钟伯",title:"更夫",personality:"寡言心细",sprite:"./npc-watchman.png",portrait:"./portrait-watchman.png",height:68,speed:1.6,bobAmp:1,foot:{dx:-.105,dy:.151},nightWalker:!0,schedule:{chen:[z(20,6)],si:[z(20,6)],wu:[z(20,6),z(24,6)],wei:[z(20,6)],shen:[z(20,6),z(22,5)],you:[z(22,6),z(22,10)],xu:[z(22,8),z(22,20),z(17,16),z(28,12),z(22,28),z(22,8)]},defaultSpots:[z(20,6)],lines:["……唔？哦，客官。老朽夜里当值，白日里眯一会儿，失礼失礼。","天干物燥——小心火烛——……咳，喊了一辈子，改不掉喽。","别怕走夜路。这村里家家户户的灯，我都认得；哪盏灭了，我心里有数。","年轻时我也走过镖，见过大世面。如今守着这小村……挺好，睡得安稳。"]},{id:"peddler",name:"陈摇鼓",title:"货郎",personality:"走南闯北",sprite:"./npc-peddler.png",portrait:"./portrait-peddler.png",height:68,speed:1.9,bobAmp:1,foot:{dx:.02,dy:.143},roam:!0,schedule:{si:[z(22,10),z(22,18),z(17,15),z(22,28),z(28,10)],wu:[z(17,16),z(22,22),z(19,15)],wei:[z(22,14),z(28,8),z(22,24)],shen:[z(17,18),z(22,30),z(28,12)]},defaultSpots:[z(22,12)],lines:["拨浪鼓儿响叮咚——梳子篦子、糖人泥哨，看一看喽！","客官面善！打个货吗？我这担子里，苏杭的玩意儿都有。","我一个月来三回，下回给您带城外的麦芽糖——小石头那猴儿都馋哭了！"]},{id:"granny",name:"周婆婆",title:"晓风人家主人",personality:"勤快慈爱",sprite:"./npc-woman.png",portrait:"./portrait-woman.png",height:66,speed:1.2,bobAmp:.7,foot:{dx:.029,dy:.117},anchored:!0,schedule:{chen:[z(32,22),z(31,21),z(32,23)],si:[z(32,22),z(33,22),z(31,22)],wu:[z(31,22),z(32,22)],wei:[z(32,22),z(31,21)],shen:[z(32,22),z(32,23),z(33,22)],you:[z(31,22),z(32,22)],xu:[z(31,22)]},defaultSpots:[z(32,22),z(31,22)],lines:["早啊！昨夜那场雨，把花瓣打落了一地，我正扫着呢。","人老了，觉就轻。鸟儿一叫，我就醒喽。","小石头那猴儿，一大早又跑到哪儿野去了？","春天的早晨啊，闭上眼睛，比睁着眼睛还热闹。"]},{id:"grannywang",name:"王婆婆",title:"喂鹅老人",personality:"慈祥耐心",sprite:"./npc-woman.png",portrait:"./portrait-woman.png",height:66,speed:1.1,bobAmp:.7,foot:{dx:.029,dy:.117},anchored:!0,schedule:{chen:[z(33,35),z(32,35),z(34,35)],si:[z(32,35),z(33,35)],wu:[z(33,35),z(34,35)],wei:[z(32,35),z(33,35)],shen:[z(33,35),z(32,35),z(34,35)],you:[z(33,35),z(32,35)],xu:[z(33,35)]},defaultSpots:[z(33,35),z(32,35)],lines:["这些鹅啊，天天在这湾里游，就爱这口谷粒。","慢些走，别惊着它们。鹅胆子小，心却灵着呢。","你是来看鹅的吧？瞧那只最白的，是领头的。","水清，鹅才爱来。这湾水，养人，也养鹅。"]},{id:"foreigner",name:"马可",title:"西域旅人",personality:"好奇热情",sprite:"./npc-foreigner.png",portrait:"./portrait-foreigner.png",height:68,s
